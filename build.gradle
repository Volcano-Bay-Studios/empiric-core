plugins {
    id 'maven-publish'
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    def javaVer = project.findProperty('java_version') ?: '21'
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    def fastutilVer = project.findProperty('fastutil_version') ?: '8.5.12'
    implementation "it.unimi.dsi:fastutil:${fastutilVer}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'empiric-core'
            from components.java
        }
    }

    repositories {
        mavenLocal()
        maven {
            url = "https://maven.ryanhcode.dev/releases/"

            credentials {
                username = "modog"
                password = System.getenv("PRIVATE_MAVEN_TOKEN") ?: ""
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
